[project]
name = "gpmanager"
version = "0.4.1"
description = "GPM: Generative Password Manager."
authors = [{ name = "apehex", email = "17317183+apehex@users.noreply.github.com" }]
readme = ".github/readme.md"
license = "AGPL-3.0"
license-files = [".github/license.md"]
requires-python = ">=3.10, <3.14"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpm"]

[tool.hatch.build.targets.sdist]
include = ["src/gpm", "pyproject.toml", ".github/readme.md", ".github/license.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
